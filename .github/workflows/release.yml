name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'pack.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pack.toml
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' pack.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "读取到版本: $VERSION"

      - name: Check tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup packwiz
        if: steps.check.outputs.exists == 'false'
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Export mrpack
        if: steps.check.outputs.exists == 'false'
        run: |
          packwiz modrinth export -o "${{ steps.ver.outputs.version }}.mrpack"

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.ver.outputs.version }}.mrpack
            ${{ steps.ver.outputs.version }}-cf.zip